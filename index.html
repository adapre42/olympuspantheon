<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Olympus Pantheon - Domain Placeholder">
  <title>Olympus Pantheon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Inter:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="stars-overlay"></div>
  
  <main class="container">
    <div class="card">
      <div class="emblem" aria-hidden="true">
        <!-- Minimalist Greek Laurel / Thunderbolt Emblem -->
        <svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <circle cx="50" cy="50" r="45" stroke="currentColor" stroke-width="1.5" stroke-dasharray="3 3"/>
          <circle cx="50" cy="50" r="38" stroke="currentColor" stroke-width="1"/>
          <!-- Thunderbolt Motif -->
          <path d="M53 18L38 48H52L47 82L66 44H51L53 18Z" fill="currentColor"/>
        </svg>
      </div>

      <header>
        <span class="eyebrow">Realm of the Gods</span>
        <h1>Olympus Pantheon</h1>
        <div class="greek-border"></div>
      </header>

      <section class="content">
        <p class="tagline">The digital gates are currently sealed.</p>
        <p class="subtext">Something legendary is being forged in the heights of the pantheon.</p>
      </section>

      <footer>
        <span class="status-indicator"></span>
        <span class="status-text">Domain Reserved</span>
      </footer>
    </div>
  </main>
</body>
</html>
